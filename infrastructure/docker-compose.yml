services:
  source-postgres:
    image: postgres:16-alpine
    container_name: rivercdc_source_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: rivercdc
      POSTGRES_PASSWORD: rivercdc_dev_password
      POSTGRES_DB: rivercdc_source
    ports:
      - "5436:5432"
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    volumes:
      - rivercdc_source_pg_data:/var/lib/postgresql/data
      - ./docker/postgres-source/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivercdc -d rivercdc_source"]
      interval: 5s
      timeout: 5s
      retries: 12

  dest-postgres:
    image: postgres:16-alpine
    container_name: rivercdc_dest_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: rivercdc
      POSTGRES_PASSWORD: rivercdc_dev_password
      POSTGRES_DB: rivercdc_dest
    ports:
      - "5437:5432"
    volumes:
      - rivercdc_dest_pg_data:/var/lib/postgresql/data
      - ./docker/postgres-dest/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rivercdc -d rivercdc_dest"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:3.8.0
    container_name: rivercdc_kafka
    restart: unless-stopped
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: rivercdc_redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    volumes:
      - rivercdc_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rivercdc_source_pg_data:
  rivercdc_dest_pg_data:
  rivercdc_redis_data:
